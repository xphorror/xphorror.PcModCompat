plugins {
    id 'com.android.library'
}

def dobbyLibrary = providers.gradleProperty('starrayDobbyLibrary').orNull

android {
    namespace 'starray.android.modmanager'
    compileSdk 35
    ndkVersion '25.2.9519653'

    defaultConfig {
        minSdk 26
        targetSdk 35
        consumerProguardFiles 'consumer-rules.pro'

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++20'
                arguments '-DANDROID_STL=c++_static'
                if (dobbyLibrary != null && !dobbyLibrary.isBlank()) {
                    arguments "-DSTARRAY_DOBBY_LIBRARY=${dobbyLibrary}"
                }
            }
        }

        ndk {
            abiFilter 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
            jniDebuggable true
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    sourceSets {
        main {
            java.srcDirs = ['src/main/java']
            jniLibs.srcDirs = ['src/main/jniLibs']
            java {
                exclude 'net/dot/**'
                exclude 'starray/android/modmanager/**'
            }
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
